name: Docker build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}
  NAME: ubuntu-mate-xrdp

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # A desktop image with an Electron build inside needs more disk than the runner keeps free by
      # default, so the toolchains this workflow never uses are removed first.
      - name: Free disk space for the build
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo rm -rf "$AGENT_TOOLSDIRECTORY" /usr/local/.ghcup
          sudo docker system prune -af >/dev/null 2>&1 || true
          df -h / | tail -1

      # Every push and pull request builds the image, which is the check itself: a Dockerfile that
      # cannot produce a working image never reaches main. Pushes to main also publish it, so
      # `docker pull` works without cloning and the desktop's own System Upgrade tool has something
      # to point at (see /etc/ubuntu-image-ref in the image).
      # A desktop image is ~12 GB, and the default docker driver writes a second full copy of it
      # when it exports - that is what runs the runner out of disk. The containerd-based builder
      # streams the layers straight to the registry (or keeps them in its own cache for a pull
      # request build) so there is never a second copy on disk.
      - name: Set up buildx
        uses: docker/setup-buildx-action@v3

      # The registry rejects an anonymous push, so the job's own token is used. This is the step
      # that was missing when the publish failed with 403: the image had already been streamed.
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (and publish it on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:26.04

  # The desktop is only useful if somebody can actually log into it. This job starts the image that
  # was just published, connects an RDP client to it and types the credentials into the real login
  # window, then reads back what that user got (root, package state, Hermes, dock, no clock widget)
  # and keeps screenshots. The step summary holds the table; the screenshots are an artifact.
  rdp-login:
    name: Real RDP login check
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    steps:
      - name: Set up the runner
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq xvfb freerdp2-x11 xdotool imagemagick >/dev/null

      - name: Start the desktop container
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull "$IMAGE:latest"
          echo "image size: $(docker image inspect --format '{{.Size}}' "$IMAGE:latest") bytes"
          docker run -d --name "$NAME" -p 3389:3389 -v "$NAME"-home:/home/ubuntu "$IMAGE:latest"
          for i in $(seq 1 30); do
            s=$(docker inspect --format '{{.State.Health.Status}}' "$NAME")
            [ "$s" = healthy ] && break
            sleep 5
          done
          echo "health=$s restarts=$(docker inspect --format '{{.RestartCount}}' "$NAME")"
          docker port "$NAME"
          docker ps --filter name="$NAME" --format '{{.Names}} {{.Status}}'

      - name: Connect over RDP and type the login
        run: |
          Xvfb :99 -screen 0 1280x800x24 >/tmp/xvfb.log 2>&1 &
          export DISPLAY=:99
          sleep 3
          mkdir -p /tmp/shots
          nohup xfreerdp /v:127.0.0.1 /cert:ignore /size:1280x800 >/tmp/rdp.log 2>&1 &
          sleep 14
          W=$(xdotool search --class freerdp | tail -1)
          if [ -z "$W" ]; then tail -20 /tmp/rdp.log; exit 1; fi
          xdotool windowfocus "$W" 2>/dev/null || true
          import -window root /tmp/shots/01-rdp-login-window.png
          # xrdp draws this form itself inside the session, so at 1280x800 the fields sit at fixed
          # positions: user entry y=412, password entry y=439, OK button y=541. The form arrives
          # with the client's own user name in the user box and the caret in the password box, so
          # every field is clicked before it is typed into.
          xdotool mousemove 681 412 click 1; sleep 1
          for i in $(seq 1 20); do xdotool key BackSpace; done
          xdotool type --clearmodifiers --delay 90 ubuntu
          xdotool mousemove 681 439 click 1; sleep 1
          for i in $(seq 1 12); do xdotool key BackSpace; done
          xdotool type --clearmodifiers --delay 90 1122
          sleep 1
          import -window root /tmp/shots/02-credentials-typed.png
          xdotool mousemove 650 541 click 1
          # xrdp 0.10 does not print the one line older versions did, so the proof used here is the
          # session itself: the desktop process has to be running on the display xrdp just opened.
          ok=0
          for i in $(seq 1 40); do
            sleep 5
            if docker exec "$NAME" pgrep -f "mate-session" >/dev/null 2>&1; then ok=1; break; fi
          done
          sleep 12
          echo "desktop process running after the typed login: $ok"
          # a session can start while the client is still refused, and only xrdp's own log shows it
          REJECT=$(docker exec "$NAME" bash -lc 'grep -icE "cannot connect|connection problem|error connecting to user session|chansrv connect failed" /var/log/xrdp.log' || true)
          echo "client refused to attach (xrdp.log lines): $REJECT"
          if [ "$REJECT" != 0 ]; then docker exec "$NAME" tail -30 /var/log/xrdp.log; ok=0; fi
          docker exec "$NAME" bash -lc 'grep -hiE "logged in|login successful|X server :[0-9]+ is working|Session in progress" /var/log/xrdp.log /var/log/xrdp-sesman.log | tail -4'
          import -window root /tmp/shots/03-desktop-after-login.png
          import -window "$W" /tmp/shots/03b-desktop-window.png 2>/dev/null || true
          if [ "$ok" = 0 ]; then
            echo "no desktop process appeared; the logs are below"
            docker logs "$NAME" 2>&1 | tail -30
            docker exec "$NAME" tail -30 /var/log/xrdp-sesman.log
            docker exec "$NAME" bash -lc 'for f in /home/ubuntu/.xsession-errors; do echo "--- $f"; tail -20 "$f" 2>/dev/null; done'
            exit 1
          fi

      - name: Read back what the logged-in user got
        run: |
          D=$(docker exec "$NAME" bash -lc 'ls /tmp/.X11-unix/ | head -1 | sed "s/^X/:/"')
          docker exec -u ubuntu -e DISPLAY="$D" -e XAUTHORITY=/home/ubuntu/.Xauthority "$NAME" bash -lc '
            . /etc/os-release
            printf "Ubuntu\t%s\n" "$PRETTY_NAME"
            printf "Session on the RDP display\t%s\n" "$(pgrep -f "SESSION" >/dev/null; echo "$DISPLAY window: $(xdotool getdisplaygeometry 2>/dev/null || echo unknown)")"
            printf "Session processes\t%s of 4 (session, window manager, panel, dock)\n" "$(pgrep -c -f "mate-session|marco|mate-panel|plank")"
            printf "Clock widget\t%s xclock processes (0 is correct: no clock widget on the desktop)\n" "$(pgrep -c xclock)"
            printf "Home directory\t%s (xrdp must be able to read .Xauthority)\n" "$(stat -c "%a %U:%G" /home/ubuntu)"
            printf "Refused clients\t%s line(s) in xrdp.log\n" "$(grep -icE "cannot connect|connection problem|error connecting to user session" /var/log/xrdp.log 2>/dev/null || echo 0)"
            printf "Dock items\t%s\n" "$(ls ~/.config/plank/dock1/launchers/ | tr "\n" " ")"
            printf "Desktop icons\t%s\n" "$(ls ~/Desktop | tr "\n" " ")"
            printf "Shell prompt\t%s\n" "$(bash -ic "echo \$PS1" 2>/dev/null | tail -1 | cut -c1-30)"
            printf "Terminal colours\t%s (from the shipped dconf defaults)\n" "$(dconf read /org/mate/terminal/profiles/default/background-color 2>/dev/null)"
            printf "Root for the RDP user\t%s (uid %s)\n" "$(sudo -n id -un)" "$(sudo -n id -u)"
            printf "Machine\t%s CPUs, %s GB RAM\n" "$(nproc)" "$(free -g | awk "/Mem:/{print \$2}")"
            printf "Package state\t%s\n" "$(apt-get -s upgrade | grep -o "[0-9]* upgraded,.*not upgraded")"
            printf "Hermes CLI\t%s\n" "$(hermes --version | head -1)"
            printf "Hermes desktop\t%s\n" "$(command -v hermes >/dev/null && hermes desktop --help 2>&1 | sed -n "1p" | cut -c1-60)"
            printf "Commands in /usr/local/bin\t%s\n" "$(ls /usr/local/bin | tr "\n" " ")"
            printf "System Upgrade\t%s\n" "$(ubuntu-migrate --check | tr "\n" " ")"
            printf "Desktop app entry\t%s ; first-login notice: %s\n" "$(test -f /usr/share/applications/hermes-ai.desktop && echo installed)" "$(test -f ~/.config/first-run-notice.done && echo shown)"
            printf "Hermes home\t%s (inside the mounted volume)\n" "$(ls -d ~/.hermes 2>/dev/null)"
            printf "Wallpaper md5\t%s\n" "$(md5sum /usr/share/backgrounds/wallpaper.jpg | cut -c1-32)"
          ' > /tmp/checks.txt 2>&1 || true
          {
            echo "## RDP session checks"
            echo
            echo "Container \`$NAME\`, image built by this run; login typed into the xrdp form."
            echo
            echo "| Check | Result |"
            echo '| --- | --- |'
            echo "| RDP login typed into the form | $(docker exec "$NAME" bash -lc 'grep -hiE "Access permitted for user|logged in" /var/log/xrdp-sesman.log | tail -1' || echo see log) |"
            echo "| Session on display | $(docker exec "$NAME" bash -lc 'grep -hoE "Session in progress on display :[0-9]+" /var/log/xrdp-sesman.log | tail -1' || echo see log) |"
            awk -F'\t' 'NF>1 { printf "| %s | %s |\n", $1, $2 }' /tmp/checks.txt
            echo
            echo "Screenshots: the \`rdp-screenshots\` artifact of this run."
          } >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/checks.txt
      - name: Type into the desktop terminal and capture it
        run: |
          export DISPLAY=:99
          D=$(docker exec "$NAME" bash -lc 'ls /tmp/.X11-unix/ | head -1 | sed "s/^X/:/"')
          docker exec -u ubuntu -e DISPLAY="$D" -e XAUTHORITY=/home/ubuntu/.Xauthority "$NAME" \
            bash -lc '( setsid mate-terminal >/dev/null 2>&1 & ); sleep 6'
          xdotool mousemove 700 500 click 1; sleep 1
          for line in 'whoami' 'sudo -i' 'id' 'lsb_release -d' 'ubuntu-migrate --check'; do
            xdotool type --clearmodifiers --delay 25 "$line"; xdotool key Return; sleep 4
          done
          sleep 2
          import -window root /tmp/shots/04-typed-terminal.png

      - name: Restart, reconnect, and check the volume
        run: |
          export DISPLAY=:99
          D=$(docker exec "$NAME" bash -lc 'ls /tmp/.X11-unix/ | head -1 | sed "s/^X/:/"')
          docker exec -u ubuntu -e DISPLAY="$D" -e XAUTHORITY=/home/ubuntu/.Xauthority "$NAME" \
            bash -lc 'echo written $(date -Is) > ~/persist-check.txt'
          docker restart "$NAME" >/dev/null
          sleep 30
          echo "health after restart: $(docker inspect --format '{{.State.Health.Status}}' "$NAME")"
          # log in a second time, the same way, to show the same user gets their session back
          pkill -x xfreerdp || true; sleep 2
          nohup xfreerdp /v:127.0.0.1 /cert:ignore /size:1280x800 >/tmp/rdp2.log 2>&1 &
          sleep 14
          W=$(xdotool search --class freerdp | tail -1)
          xdotool windowfocus "$W" 2>/dev/null || true
          xdotool mousemove 681 412 click 1; sleep 1
          for i in $(seq 1 20); do xdotool key BackSpace; done
          xdotool type --clearmodifiers --delay 90 ubuntu
          xdotool mousemove 681 439 click 1; sleep 1
          xdotool type --clearmodifiers --delay 90 1122
          xdotool mousemove 650 541 click 1
          ok=0
          for i in $(seq 1 30); do
            sleep 5
            docker exec "$NAME" pgrep -f "mate-session" >/dev/null 2>&1 && { ok=1; break; }
          done
          import -window root /tmp/shots/05-after-restart-reconnect.png || true
          echo "desktop back after restart and a second typed login: $ok"
          [ "$ok" = 1 ] || { docker exec "$NAME" tail -20 /var/log/xrdp-sesman.log; exit 1; }
          docker exec "$NAME" pgrep -af "mate-session" | head -2
          docker rm -f "$NAME" >/dev/null
          sleep 2
          docker run -d --name "$NAME" -p 3389:3389 -v "$NAME"-home:/home/ubuntu "$IMAGE:latest" >/dev/null
          sleep 40
          echo "persisted after recreating the container: $(docker exec "$NAME" cat /home/ubuntu/persist-check.txt)"

      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rdp-screenshots
          path: /tmp/shots/
          if-no-files-found: warn
